<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P.A.K.S. Sprite Preview</title>
    <style>
        :root { --bg: #1e1f24; --panel: #2a2c33; --text: #e8e8ea; --muted: #9a9ca5; --accent: #f2c14e; }
        * { box-sizing: border-box; }
        body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, sans-serif; }
        header { padding: 12px 16px; border-bottom: 1px solid #000; display: flex; gap: 16px; align-items: baseline; flex-wrap: wrap; }
        header h1 { margin: 0; font-size: 18px; color: var(--accent); letter-spacing: 1px; }
        header p { margin: 0; color: var(--muted); }
        main { display: grid; grid-template-columns: 260px 1fr; gap: 16px; padding: 16px; }
        @media (max-width: 800px) { main { grid-template-columns: 1fr; } }
        aside { background: var(--panel); border-radius: 8px; padding: 12px; display: flex; flex-direction: column; gap: 12px; align-self: start; }
        label { display: flex; flex-direction: column; gap: 4px; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .5px; }
        label.row { flex-direction: row; align-items: center; gap: 8px; text-transform: none; font-size: 14px; color: var(--text); letter-spacing: 0; }
        select, input[type=range] { width: 100%; }
        select, button { background: #3a3d46; color: var(--text); border: 1px solid #50535e; border-radius: 4px; padding: 6px 8px; font: inherit; cursor: pointer; }
        button:hover, select:hover { border-color: var(--accent); }
        button.on { background: var(--accent); color: #111; }
        .buttons { display: flex; flex-wrap: wrap; gap: 6px; }
        .value { color: var(--text); text-transform: none; }
        section { background: var(--panel); border-radius: 8px; padding: 12px; margin-bottom: 16px; }
        section h2 { margin: 0 0 8px; font-size: 13px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); }
        canvas { display: block; width: 100%; border-radius: 4px; }
    </style>
</head>
<body>
<header>
    <h1>SPRITE PREVIEW</h1>
    <p>The vector stickman and entities, drawn by the same code as the game (<code>stickman.js</code>, <code>entityArt.js</code>). Serve <code>GameEngine/</code> and open <code>/sprite-preview.html</code>.</p>
</header>
<main>
    <aside>
        <label>State
            <select id="state">
                <option value="arc">Jump arc (jump, fall, land)</option>
                <option value="cycle">Auto-cycle every state</option>
                <option value="idle">Idle</option>
                <option value="walk">Walk</option>
                <option value="run">Run</option>
                <option value="skid">Skid</option>
                <option value="jump">Jump</option>
                <option value="fall">Fall</option>
                <option value="slide">Slide</option>
                <option value="crouch">Crouch</option>
                <option value="wall">Wall slide</option>
            </select>
        </label>
        <label>Speed <span class="value" id="speedOut"></span>
            <input id="speed" type="range" min="0" max="650" step="5" value="250">
        </label>
        <label>Playback <span class="value" id="slowOut"></span>
            <input id="slow" type="range" min="0.1" max="1" step="0.05" value="1">
        </label>
        <label>Zoom
            <select id="zoom"><option>1</option><option selected>2</option><option>3</option><option>4</option></select>
        </label>
        <label>Background
            <select id="bg">
                <option value="#f5e9ec">Tutorial (light)</option>
                <option value="#ffffff">White</option>
                <option value="#8a8f99">Grey</option>
                <option value="#23252b">Dark</option>
            </select>
        </label>
        <label class="row"><input id="joints" type="checkbox"> Show joints</label>
        <label class="row"><input id="shadow" type="checkbox" checked> Ground shadow</label>
        <div class="buttons">
            <button id="turn">Turn around</button>
            <button id="pause">Pause</button>
            <button id="die">Die</button>
        </div>
    </aside>
    <div>
        <section>
            <h2>Stickman</h2>
            <canvas id="big" height="360"></canvas>
        </section>
        <section>
            <h2>Every state</h2>
            <canvas id="grid" height="190"></canvas>
        </section>
        <section id="entitySection" hidden>
            <h2>Entities</h2>
            <canvas id="entities" height="200"></canvas>
        </section>
    </div>
</main>
<script src="./boundingBox.js"></script>
<script src="./stickman.js"></script>
<script src="./deathParticle.js"></script>
<script src="./deathAnimate.js"></script>
<script>
    const $ = id => document.getElementById(id);
    const STATES = ['idle', 'walk', 'run', 'skid', 'jump', 'fall', 'slide', 'crouch', 'wall'];
    const BOX = {w: 20, h: 74};

    // Canvases are drawn at the screen's pixel density so zooming shows the real vector quality
    function fit(canvas) {
        const dpr = window.devicePixelRatio || 1;
        const w = canvas.clientWidth, h = Number(canvas.getAttribute('height'));
        canvas.style.height = h + 'px';
        if (canvas.width !== Math.round(w * dpr)) { canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr); }
        const ctx = canvas.getContext('2d');
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        return {ctx, w, h};
    }

    // What the player's physics would be doing in each state, so the rig gets realistic input
    function inputFor(state, t, speed, facing) {
        const vx = speed * facing;
        switch (state) {
            case 'idle': case 'crouch': return {state, vx: 0, vy: 0, grounded: true, facing};
            case 'walk': return {state, vx: Math.sign(vx) * Math.min(Math.abs(vx), 400) || 0, vy: 0, grounded: true, facing};
            case 'run': case 'skid': case 'slide': return {state, vx, vy: 0, grounded: true, facing};
            case 'jump': return {state, vx, vy: -850 * (1 - (t % 0.8) / 0.8), grounded: false, facing};
            case 'fall': return {state, vx, vy: 900 * ((t % 0.8) / 0.8), grounded: false, facing};
            case 'wall': return {state, vx: 0, vy: 120, grounded: false, facing, wallSide: -facing};
        }
    }

    const main = {rig: new Stickman.Rig(), t: 0, x: 0, height: 0, vy: 0, arcRest: 0, facing: 1, cycleIndex: 0, cycleT: 0, death: null};
    const gridRigs = STATES.map(() => new Stickman.Rig());
    let paused = false;

    function stepMain(dt) {
        const mode = $('state').value, speed = Number($('speed').value);
        main.t += dt;
        let input;
        if (mode === 'arc') {
            // A real jump: take-off at the game's jump speed and gravity, then a short rest on landing
            if (main.height <= 0 && main.arcRest <= 0) { main.vy = -850; main.height = 0.001; }
            if (main.height > 0) {
                main.vy += 2000 * dt;
                main.height -= main.vy * dt;
                if (main.height <= 0) { main.height = 0; main.arcRest = 0.5; }
            } else {
                main.arcRest -= dt;
            }
            const air = main.height > 0;
            input = {state: air ? (main.vy < 0 ? 'jump' : 'fall') : (speed >= 20 ? 'walk' : 'idle'),
                vx: speed * main.facing, vy: air ? main.vy : 0, grounded: !air, facing: main.facing};
        } else if (mode === 'cycle') {
            main.cycleT += dt;
            if (main.cycleT > 1.2) { main.cycleT = 0; main.cycleIndex = (main.cycleIndex + 1) % STATES.length; }
            input = inputFor(STATES[main.cycleIndex], main.cycleT, speed, main.facing);
            main.height = 0;
        } else {
            input = inputFor(mode, main.t, speed, main.facing);
            main.height = 0;
        }
        main.input = input;
        main.rig.update(dt, input);
        main.x += (input.state === 'wall' ? 0 : input.vx) * dt;   // the ground scrolls under the figure at its speed
    }

    function drawGround(ctx, left, right, groundY, scroll, bg) {
        const dark = parseInt(bg.slice(1, 3), 16) < 128;
        ctx.fillStyle = dark ? '#3a3d46' : '#9b2a3f';
        ctx.fillRect(left, groundY, right - left, 400);
        // Marks fixed to the ground: a planted foot should stay put against them
        ctx.fillStyle = dark ? '#555966' : '#7c1f31';
        const step = 25;
        for (let x = Math.floor((left + scroll) / step) * step; x < right + scroll; x += step) {
            ctx.fillRect(x - scroll, groundY + 4, 2, 8);
        }
    }

    function drawJoints(ctx, j, zoom) {
        ctx.fillStyle = '#f2c14e';
        for (const [k, p] of Object.entries(j)) {
            if (k === 'headDir') continue;
            ctx.beginPath();
            ctx.arc(p.x, p.y, 1.6 / zoom * 2, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    function drawMain() {
        const {ctx, w, h} = fit($('big'));
        const zoom = Number($('zoom').value), bg = $('bg').value;
        ctx.fillStyle = bg;
        ctx.fillRect(0, 0, w, h);
        ctx.save();
        const groundY = h - 50;
        ctx.translate(w / 2, groundY);
        ctx.scale(zoom, zoom);
        drawGround(ctx, -w / 2 / zoom, w / 2 / zoom, 0, main.x, bg);
        if (main.input && main.input.state === 'wall') {
            // The wall behind the figure
            const side = main.input.wallSide;
            ctx.fillStyle = parseInt(bg.slice(1, 3), 16) < 128 ? '#3a3d46' : '#9b2a3f';
            ctx.fillRect(side > 0 ? BOX.w / 2 : -BOX.w / 2 - 60, -300, 60, 300);
        }
        const feetY = -main.height;
        if ($('shadow').checked && !(main.input && main.input.state === 'wall')) Stickman.drawShadow(ctx, 0, 0, main.height);
        if (main.death) {
            main.death.draw(ctx);
        } else {
            const j = main.rig.joints(0, feetY);
            Stickman.draw(ctx, j);
            if ($('joints').checked) {
                drawJoints(ctx, j, zoom);
                ctx.strokeStyle = 'rgba(255, 0, 0, 0.6)';
                ctx.lineWidth = 1 / zoom;
                ctx.strokeRect(-BOX.w / 2, feetY - BOX.h, BOX.w, BOX.h);
            }
        }
        ctx.restore();
        ctx.fillStyle = parseInt(bg.slice(1, 3), 16) < 128 ? '#e8e8ea' : '#333';
        ctx.font = '13px monospace';
        const i = main.input || {};
        ctx.fillText(`${i.state || ''}  vx ${Math.round(i.vx || 0)}  vy ${Math.round(i.vy || 0)}`, 12, 20);
    }

    function drawGrid(dt) {
        const {ctx, w, h} = fit($('grid'));
        const bg = $('bg').value, speed = Number($('speed').value);
        ctx.fillStyle = bg;
        ctx.fillRect(0, 0, w, h);
        const cell = w / STATES.length, zoom = Math.min(1.6, cell / 60);
        STATES.forEach((state, i) => {
            const input = inputFor(state, main.t, state === 'walk' ? Math.min(speed, 400) || 200 : speed || 300, main.facing);
            gridRigs[i].update(dt, input);
            ctx.save();
            ctx.translate(cell * (i + 0.5), h - 34);
            ctx.scale(zoom, zoom);
            ctx.fillStyle = parseInt(bg.slice(1, 3), 16) < 128 ? '#3a3d46' : '#9b2a3f';
            ctx.fillRect(-cell / 2 / zoom, 0, cell / zoom, 3);
            if (state === 'wall') ctx.fillRect(input.wallSide > 0 ? BOX.w / 2 : -BOX.w / 2 - 6, -90, 6, 90);
            const lift = state === 'jump' || state === 'fall' || state === 'wall' ? 12 : 0;
            if ($('shadow').checked && state !== 'wall') Stickman.drawShadow(ctx, 0, 0, lift);
            Stickman.draw(ctx, gridRigs[i].joints(0, -lift));
            ctx.restore();
            ctx.fillStyle = parseInt(bg.slice(1, 3), 16) < 128 ? '#e8e8ea' : '#333';
            ctx.font = '12px monospace';
            ctx.textAlign = 'center';
            ctx.fillText(state, cell * (i + 0.5), h - 10);
            ctx.textAlign = 'left';
        });
    }

    // Hooks for the entity row (entityArt.js adds it)
    const extraRows = [];

    let last = performance.now();
    function frame(now) {
        const real = Math.min(0.1, (now - last) / 1000);
        last = now;
        const dt = paused ? 0 : real * Number($('slow').value);
        stepMain(dt);
        if (main.death) {
            main.death.update(0, dt);   // as in the game: its clock is stopped while dead, the pieces run on real time
            main.deathT = (main.deathT || 0) + dt;
            if (main.deathT > 1.2) { main.death = null; main.deathT = 0; }
        }
        drawMain();
        drawGrid(dt);
        for (const row of extraRows) row(dt);
        requestAnimationFrame(frame);
    }

    $('speed').oninput = () => $('speedOut').textContent = $('speed').value + ' px/s';
    $('slow').oninput = () => $('slowOut').textContent = Number($('slow').value).toFixed(2) + '×';
    $('speed').oninput(); $('slow').oninput();
    $('turn').onclick = () => { main.facing = -main.facing; };
    $('pause').onclick = () => { paused = !paused; $('pause').classList.toggle('on', paused); };
    $('die').onclick = () => {
        const j = main.rig.joints(0, -main.height);
        main.death = new DeathAnimation(0, -main.height - BOX.h / 2, Stickman.segments(j));
        main.deathT = 0;
    };
    requestAnimationFrame(frame);
</script>
</body>
</html>
